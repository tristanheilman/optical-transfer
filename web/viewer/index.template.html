<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>optical-transfer · GIF viewer</title>
    <style>
      :root {
        --bg: #0b0b0f;
        --panel: #16161d;
        --line: #23232d;
        --fg: #e5e7eb;
        --dim: #9aa0aa;
        --blue: #3b82f6;
        --green: #10b981;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 50% -10%, #14141c, var(--bg));
        color: var(--fg);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
      }
      #app { max-width: 640px; margin: 0 auto; padding: 32px 20px 56px; }
      .hd h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
      .hd .sub { color: var(--dim); margin: 8px 0 0; }
      .tabs { display: flex; gap: 8px; margin: 28px 0 16px; }
      .tab {
        flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
        background: var(--panel); color: var(--dim); font-weight: 600; font-size: 15px; cursor: pointer;
      }
      .tab.active { color: #fff; border-color: var(--blue); background: #1b2740; }
      .panel { display: flex; flex-direction: column; gap: 14px; }
      .drop {
        display: block; border: 1.5px dashed var(--line); border-radius: 14px;
        background: var(--panel); padding: 40px 20px; text-align: center; cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      .drop:hover, .drop.over { border-color: var(--blue); background: #12161f; }
      .drop-inner { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--dim); }
      .drop-emoji { font-size: 40px; }
      .hidden { display: none; }
      .opt { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
      .status { color: var(--dim); min-height: 20px; margin: 0; }
      .result { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .btn {
        border: 0; border-radius: 12px; padding: 14px 22px; font-size: 16px; font-weight: 700;
        color: #fff; cursor: pointer; min-width: 220px;
      }
      .btn.primary { background: var(--green); }
      .preview-img {
        max-width: 100%; width: 300px; height: auto; border-radius: 12px;
        background: #000; image-rendering: pixelated;
      }
      .preview-text {
        align-self: stretch; max-height: 320px; overflow: auto; background: #0b0b0f;
        border: 1px solid var(--line); border-radius: 10px; padding: 12px;
        font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--fg); white-space: pre-wrap; word-break: break-word;
      }
      .link { color: var(--blue); word-break: break-all; }
      .ft { margin-top: 40px; color: var(--dim); font-size: 13px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>%BUNDLE%</script>
  </body>
</html>
